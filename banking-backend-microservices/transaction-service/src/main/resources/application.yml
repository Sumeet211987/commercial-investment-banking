server:
  port: 8083

spring:
  application:
    name: transaction-service

  datasource:
    url:  jdbc:postgresql://localhost:5433/transdb
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


logging:
  level:
    root: INFO
    com.cib.transaction: DEBUG

